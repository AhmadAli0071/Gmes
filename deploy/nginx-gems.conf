# GEMS — HTTP -> HTTPS redirect (domain hosts only)
server {
    listen 80;
    listen [::]:80;
    server_name gemsvg.com www.gemsvg.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# GEMS — HTTP catch-all (bare IP / unknown hosts stay on HTTP: no cert for an IP)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}

# GEMS — primary domain (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gemsvg.com www.gemsvg.com;

    ssl_certificate     /etc/letsencrypt/live/gemsvg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gemsvg.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/gemsvg.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — HTTPS confirmed working on 2026-10-12
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # media uploads go up to 30 MB
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}

# GEMS — catch-all over TLS (bare IP / unknown hosts)
